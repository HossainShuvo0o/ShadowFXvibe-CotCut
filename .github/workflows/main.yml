name: Build ShadowFXvibe-CotCut APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Restore Keystore
        run: |
          echo "Decoding keystore..."
          base64 -d debug.keystore.base64 > debug.keystore
          mkdir -p app
          cp debug.keystore app/debug.keystore
          cp debug.keystore app/debug.keystore || true
          cp debug.keystore ~/.android/debug.keystore || true
          ls -lh debug.keystore app/debug.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFXvibe-CotCut-APK
          path: app/build/outputs/apk/debug/*.apk
